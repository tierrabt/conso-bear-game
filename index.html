<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<title>Conso Bear: Catch the ZAPs</title>
<style>
:root{--bg:#eef3ff;--ink:#0b1b3a;--blue:#2f4bff;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--ink:#eaf0ff;--blue:#7b8cff;--card:#fff}}
:root[data-theme="dark"]{--bg:#0b1020;--ink:#eaf0ff;--blue:#7b8cff;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;user-select:none}
h1{margin:0;font-size:20px;letter-spacing:.5px}
h1 span{color:var(--blue)}
#wrap{position:relative;width:min(92vw,360px);aspect-ratio:360/560;max-height:80vh;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(47,75,255,.25);background:#fff}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.88);color:#0b1b3a;text-align:center;padding:20px}
.ov h2{margin:0;font-size:30px;line-height:1}
.ov h2 b{color:#2f4bff}
.ov p{margin:0;font-size:15px}
.btn{background:#2f4bff;color:#fff;border:0;border-radius:14px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:#0b1b3a}
.hidden{display:none}
.hero{justify-content:flex-start;padding-top:18px;gap:5px;background:linear-gradient(to bottom,rgba(236,246,255,.5) 0%,rgba(236,246,255,.16) 42%,rgba(236,246,255,0) 62%)}
.badge{font-size:10px;letter-spacing:1.5px;font-weight:700;color:#2f4bff;background:#fff;border:1.5px solid #2f4bff;border-radius:99px;padding:3px 10px}
.ttl{margin:6px 0 0;display:flex;flex-direction:column;line-height:.88;font-family:"Lilita One","Trebuchet MS",system-ui,sans-serif;font-weight:400}
.ttl span{font-size:66px;-webkit-text-stroke:2px #0b1b3a;text-shadow:0 4px 0 #0b1b3a}
.t1{color:#fff}.t2{color:#2f4bff}
.sub{letter-spacing:5px;font-size:12px;font-weight:800;color:#0b1b3a;margin-top:8px}
.legend{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0 8px}
.chip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:12px;padding:3px 8px;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(47,75,255,.15)}
.chip img{height:22px;width:22px}
.play{font-family:"Lilita One","Trebuchet MS",system-ui,sans-serif;font-size:30px;font-weight:400;letter-spacing:1px;color:#fff;-webkit-text-stroke:1.5px #0b1b3a;text-shadow:0 3px 0 #0b1b3a;background:linear-gradient(#6f8bff,#2f4bff);border:3px solid #0b1b3a;border-radius:20px;padding:8px 38px 10px;box-shadow:0 6px 0 #0b1b3a,0 12px 18px rgba(11,27,58,.28);animation:pu 1.4s ease-in-out infinite}
.play:active{box-shadow:0 2px 0 #0b1b3a;margin-top:4px}
@keyframes pu{50%{transform:scale(1.06)}}
.how{font-size:12px;opacity:.85;font-weight:700;margin-top:6px}
.best{font-size:13px;font-weight:800;color:#2f4bff}
.menu-bottom{position:absolute;left:0;right:0;bottom:58px;display:flex;flex-direction:column;align-items:center;gap:6px}
.how{color:#0b1b3a}
@keyframes sh{0%,100%{transform:translate(0,0);box-shadow:0 8px 30px rgba(47,75,255,.25)}15%{transform:translate(-10px,5px);box-shadow:0 0 44px 8px rgba(224,49,49,.75)}30%{transform:translate(9px,-6px)}45%{transform:translate(-8px,-4px)}60%{transform:translate(7px,5px)}80%{transform:translate(-4px,2px)}}
#wrap.shake{animation:sh .38s}
#mute{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.7);border:0;border-radius:12px;padding:4px 9px;font-size:16px;cursor:pointer;z-index:2}
small{opacity:.7}
</style>
</head>
<body>
<h1>CONSO BEAR: <span>Catch the ZAPs</span></h1>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Sound">🔊</button>
  <div class="ov hero" id="start">
    <div class="badge">FAN-MADE · BEAR MEME CONTEST</div>
    <h2 class="ttl"><span class="t1">CONSO</span><span class="t2">BEAR</span></h2>
    <div class="sub">CATCH THE ZAPS</div>
    <div class="menu-bottom">
      <button class="btn play" id="play">LET’S ZAP!</button>
      <div class="how">Drag to move</div>
      <div class="best" id="bestline"></div>
    </div>
  </div>
  <div class="ov hidden" id="over">
    <h2>Game Over</h2>
    <p id="res"></p>
    <a class="btn" id="share" target="_blank" rel="noopener">Share on X</a>
    <button class="btn alt" id="again">Play again</button>
  </div>
</div>

const MUZ={x:132,y:315};
let mI=[],mP=[],mS=.3;
function drawMenu(dt){
  if(MENUBG.complete&&MENUBG.naturalWidth){const sh=MENUBG.naturalHeight,sw=Math.min(MENUBG.naturalWidth,sh*W/H);ctx.drawImage(MENUBG,0,0,sw,sh,0,0,W,H)}
  else{ctx.fillStyle='#bfe3ff';ctx.fillRect(0,0,W,H)}
  mS-=dt;
  if(mS<=0&&mI.length<7){
    mS=rnd(.7,1.1);
    mI.push({x:MUZ.x,y:MUZ.y,vx:rnd(50,170),vy:-rnd(300,420),k:Math.floor(Math.random()*ICONS.length),fl:rnd(392,470),b:0,fade:1,rot:0,vr:rnd(-3,3)});
    for(let i=0;i<7;i++)mP.push({x:MUZ.x+rnd(-3,3),y:MUZ.y+rnd(-3,3),vx:rnd(10,90),vy:rnd(-70,10),life:.45});
  }
  for(const o of mI){
    if(o.done){o.fade-=dt*.9;continue}
    o.vy+=520*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;
    if(o.y>=o.fl&&o.vy>0){o.y=o.fl;if(o.b<1){o.vy*=-.38;o.vx*=.5;o.b++}else{o.done=true;o.vx=0;o.vy=0}}
  }
  mI=mI.filter(o=>o.fade>0);
  for(const o of mI){
    const im=ICONS[o.k];if(!im.complete)continue;
    ctx.save();ctx.globalAlpha=Math.min(1,o.fade*2);
    ctx.fillStyle='rgba(30,60,120,.18)';ctx.beginPath();ctx.ellipse(o.x,o.fl+18,14,4.5,0,0,7);ctx.fill();
    ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.shadowColor='rgba(255,255,255,.9)';ctx.shadowBlur=10;ctx.drawImage(im,-19,-19,38,38);
    ctx.restore();
  }
  for(const q of mP){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
  mP=mP.filter(q=>q.life>0);
  for(const q of mP){ctx.globalAlpha=Math.min(1,q.life*2.2);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y,3+(.45-q.life)*14,0,7);ctx.fill()}
  ctx.globalAlpha=1;
}
function idle(ts){
  if(running)return;
  const dt=Math.min((ts-(idle.l||ts))/1000,.05);idle.l=ts;
  drawMenu(dt);requestAnimationFrame(idle);
}
$('bestline').textContent=best?('Best: '+best):'';
requestAnimationFrame(idle);
